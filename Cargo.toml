[package]
name = "ess-p2p-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime & utilities
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization & encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
base64 = "0.22"
hex = "0.4"

# Cryptography
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
aes-gcm = "0.10"
aead = "0.5"                     # Trait KeyInit yang dipakai oleh aes-gcm & chacha20poly1305
hmac = "0.12"
rand = "0.8"
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"

# Networking (P2P)
libp2p = { version = "0.56", features = [
  "tcp",
  "tokio",
  "noise",
  "yamux",
  "kad",
  "identify",
  "ping",
  "request-response",
  "json",
  "macros",
  "ed25519",
  "rsa"
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Logging & tracing
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
subtle = "2"
# Storage & state
sled = "0.34"
zeroize = { version = "1.7", features = ["derive"] }
dashmap = "5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.3"
tempfile = "3"
parking_lot = "0.12"

# Post‑quantum experiment (opsional)
ml-kem = { version = "0.3", features = ["getrandom"] }
